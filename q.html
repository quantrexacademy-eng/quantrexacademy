<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question | Quantrex Academy</title>
  <meta name="description" content="Open a Quantrex Academy previous-year question. The full stem, options and solution are on the question URL.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" id="can" href="https://www.quantrexacademy.com/questions">
  <meta name="theme-color" content="#1565C0">
  <style>
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a}
    .wrap{max-width:720px;margin:0 auto;padding:28px 16px}
    a{color:#0d47a1}
  </style>
  <script>
    (function () {
      var path = location.pathname || "";
      var m = path.match(/\/q\/([^/]+)/);
      var id = m ? decodeURIComponent(m[1]) : new URLSearchParams(location.search).get("id");
      if (id) location.replace("/api/seo-q?id=" + encodeURIComponent(id));
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <p>Opening this Quantrex Academy question.</p>
    <p>If the page does not open, go to <a href="/questions">all questions</a> or <a href="/app.html">the app</a>.</p>
  </div>
</body>
</html>
