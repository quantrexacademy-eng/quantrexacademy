    <script>
      (function () {
        try {
          var t = localStorage.getItem("quantrex_test_theme") || localStorage.getItem("quantrex_theme");
          if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
      /* qxmd306: Play TWA / installed PWA = app. Browser = web (Quizrr NTA). */
      (function () {
        try {
          var app = false;
          if (window.matchMedia && (
            window.matchMedia("(display-mode: standalone)").matches ||
            window.matchMedia("(display-mode: fullscreen)").matches ||
            window.matchMedia("(display-mode: minimal-ui)").matches
          )) app = true;
          if (navigator.standalone) app = true;
          if (String(document.referrer || "").indexOf("android-app://") === 0) app = true;
          if (/\bapp=1\b/.test(String(location.search || ""))) app = true;
          try { if (localStorage.getItem("qx_force_app_ui") === "1") app = true; } catch (_) {}
          document.documentElement.setAttribute("data-qx-shell", app ? "app" : "web");
        } catch (e) {
          document.documentElement.setAttribute("data-qx-shell", "web");
        }
      })();
    </script>
